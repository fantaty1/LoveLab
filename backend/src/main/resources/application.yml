spring:
  application:
    name: lovelab
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
    clean-disabled: true
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
server:
  port: ${PORT:8080}
  max-http-request-header-size: 16KB
  servlet:
    session:
      timeout: 12h
      cookie:
        name: LOVELAB_SESSION
        http-only: true
        same-site: lax
  tomcat:
    max-http-form-post-size: 1MB
    threads:
      max: 100
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
lovelab:
  seed-enabled: ${SEED_ENABLED:false}
  allowed-origins: ${ALLOWED_ORIGINS:http://127.0.0.1:5173,http://127.0.0.1:4173,http://localhost:5173,http://localhost:4173}
  bootstrap:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
logging:
  level:
    root: INFO
    com.lovelab: INFO
