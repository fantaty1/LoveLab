# Install on the server's HTTPS reverse proxy and replace domain/certificate paths.
server {
    listen 80;
    server_name lovelab.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name lovelab.example.com;
    ssl_certificate /etc/letsencrypt/live/lovelab.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lovelab.example.com/privkey.pem;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
